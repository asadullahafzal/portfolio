services:
  web:
    build: .
    image: asadullahafzal-portfolio
    container_name: asadullahafzal-portfolio
    restart: unless-stopped
    # Only reachable from the VPS itself; Nginx is the public entry point
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
