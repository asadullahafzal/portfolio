# Nginx site for asadullahafzal.com → Next.js container on 127.0.0.1:3000
# Certbot adds the HTTPS (443) blocks and the HTTP→HTTPS redirect automatically.

# www → bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.asadullahafzal.com;
    return 301 https://asadullahafzal.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name asadullahafzal.com;

    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Fingerprinted build assets never change, so let browsers cache them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
